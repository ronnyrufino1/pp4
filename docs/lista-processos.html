<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Processos - LegalTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Painel de Processos</h1>
        <a href="criar-processo.html" class="btn btn-primary">Novo Processo</a>
      </div>

      <div class="card shadow-sm p-3 mb-4 bg-light">
        <div class="row g-3 alignment-items-center">
          <div class="col-md-8">
            <label class="form-label fw-bold text-secondary"
              >Busca Rápida (Nº Processo, Cliente ou Descrição):</label
            >
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="text-muted"
                  viewBox="0 0 16 16"
                >
                  <path
                    d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"
                  />
                </svg>
              </span>
              <input
                type="text"
                id="campo-busca-google"
                class="form-control border-start-0"
                placeholder="Digite para pesquisar instantaneamente..."
              />
            </div>
          </div>
          <div class="col-md-4">
            <label class="form-label fw-bold text-secondary"
              >Filtrar por Status:</label
            >
            <select id="filtro-status-select" class="form-select">
              <option value="Todos">Todos os Status</option>
              <option value="Ativo">Ativo</option>
              <option value="Suspenso">Suspenso</option>
              <option value="Arquivado">Arquivado</option>
            </select>
          </div>
        </div>
      </div>

      <div class="table-responsive bg-white rounded shadow-sm">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-secondary">
            <tr>
              <th>Nº do Processo (CNJ)</th>
              <th>Cliente Associado</th>
              <th>Status Atual</th>
              <th>Descrição Resumida</th>
              <th class="text-center" style="width: 160px">Ações</th>
            </tr>
          </thead>
          <tbody id="processos-tbody"></tbody>
        </table>
      </div>

      <div id="container-paginacao-processos" class="mt-3"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>

    <script>
      $(document).ready(function () {
        $("#navbar-container").load("navbar.html");

        $("#filtrar").click(function () {
          const cid = $("#select-clientes").val();

          if (cid) {
            $.get(
              `pp4.railway.internal/clientes/${cid}/processos`,
              function (data) {
                const lista = data.dados || data;
                renderizarTabelaProcessos(lista);
              },
            ).fail(function () {
              exibirToast("Erro ao filtrar processos deste cliente.", "danger");
            });
          } else {
            if (typeof carregarProcessos === "function") {
              carregarProcessos();
            }
          }
        });
      });
    </script>
  </body>
</html>
