<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Editar Processo - LegalTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <div class="container mt-4" style="max-width: 600px">
      <div class="card shadow-sm p-4">
        <h1 class="mb-4">Editar Processo</h1>
        <form id="editar-form">
          <input type="hidden" id="proc-id" />
          <input type="hidden" id="cliente-id-salvo" />
          <div class="mb-3">
            <label class="form-label">Número do Processo:</label>
            <input type="text" id="numero" class="form-control" readonly />
            <small class="text-muted"
              >O número do processo não pode ser modificado após o
              registro.</small
            >
          </div>

          <div class="mb-3">
            <label class="form-label"
              >Descrição dos Fatos / Movimentação:</label
            >
            <textarea
              id="descricao"
              class="form-control"
              rows="4"
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label">Alterar Status:</label>
            <select id="status-select" class="form-select" required>
              <option value="Ativo">Ativo</option>
              <option value="Suspenso">Suspenso</option>
              <option value="Arquivado">Arquivado</option>
            </select>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a href="lista-processos.html" class="btn btn-secondary">Voltar</a>
            <button type="submit" class="btn btn-warning fw-bold">
              Atualizar e Notificar
            </button>
          </div>
        </form>

        <div id="mensagem" class="mt-3"></div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
    <script>
      $(document).ready(function () {
        $("#navbar-container").load("navbar.html");

        const urlParams = new URLSearchParams(window.location.search);
        const pid = parseInt(urlParams.get("id"));

        if (!pid) {
          exibirToast("ID do processo não foi fornecido na URL.", "danger");
          return;
        }

        $.get(`pp4.railway.internal/processos/${pid}`, function (data) {
          $("#proc-id").val(pid);
          $("#cliente-id-salvo").val(data.cliente_id);

          // Mapeia para as chaves reais retornadas pelo backend
          $("#numero").val(data.numero_cnj || data.numero);
          $("#descricao").val(data.descricao);
          $("#status-select").val(data.status);
        }).fail(function () {
          exibirToast(`Processo com ID ${pid} não existe.`, "danger");
        });
      });
    </script>
  </body>
</html>
