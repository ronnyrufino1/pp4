<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Editar Cliente - LegalTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <div class="container mt-4" style="max-width: 600px">
      <div class="card shadow-sm p-4">
        <h1 class="mb-4">Editar Cliente</h1>
        <div class="editar-form">
          <form id="editar-cliente-form">
            <input type="hidden" id="cliente-id" />
            <div class="mb-3">
              <label class="form-label fw-bold">Nome / Razão Social:</label>
              <input
                type="text"
                id="nome"
                class="form-control"
                required
                minlength="3"
                maxlength="100"
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold"
                >CPF / CNPJ (Apenas números):</label
              >
              <input type="text" id="cpf_cnpj" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">E-mail de Notificação:</label>
              <input type="email" id="email" class="form-control" required />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Telefone (Opcional):</label>
              <input type="text" id="telefone" class="form-control" />
            </div>

            <div class="d-flex justify-content-between align-items-center">
              <a href="index-clientes.html" class="btn btn-outline-secondary"
                >Cancelar</a
              >
              <button type="submit" class="btn btn-warning fw-bold">
                Salvar Alterações
              </button>
            </div>
          </form>

          <div id="mensagem"></div>
        </div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/main.js"></script>
    <script>
      $(document).ready(function () {
        $("#navbar-container").load("navbar.html");

        const urlParams = new URLSearchParams(window.location.search);
        const clienteId = parseInt(urlParams.get("id"));

        if (!clienteId) {
          $("#mensagem").html(
            '<div class="alert alert-danger mt-3">ID do cliente não foi fornecido.</div>',
          );
          $("button[type='submit']").prop("disabled", true);
          return;
        }

        carregarDadosCliente(clienteId);

        $("#editar-cliente-form").submit(function (e) {
          e.preventDefault();

          const payload = {
            nome: $("#nome").val(),
            cpf_cnpj: $("#cpf_cnpj").val(),
            email: $("#email").val(),
            telefone: $("#telefone").val() || null,
          };

          console.log("DADOS QUE O JQUERY ESTÁ TENTANDO ENVIAR:", payload);

          atualizarCliente(clienteId, payload);
        });
      });
    </script>
  </body>
</html>
