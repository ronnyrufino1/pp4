<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Novo Processo - LegalTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <div class="container mt-4" style="max-width: 700px">
      <div class="card shadow-sm p-4">
        <h2 class="mb-4">Novo Processo</h2>

        <form id="form-criar-processo">
          <div class="mb-3">
            <label for="select-clientes" class="form-label fw-bold"
              >Selecione o Cliente Associado:</label
            >
            <select id="select-clientes" class="form-select" required>
              <option value="">-- Escolha um cliente --</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Número do Processo (CNJ):</label>
            <input
              type="text"
              id="numero"
              name="numero"
              class="form-control"
              placeholder="0000000-00.0000.0.00.0000"
              required
            />
            <small class="text-muted"
              >O CNJ deve conter exatamente 20 números.</small
            >
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold"
              >Descrição / Resumo do Caso:</label
            >
            <textarea
              id="descricao"
              name="descricao"
              class="form-control"
              rows="4"
              placeholder="Detalhes do processo..."
              required
            ></textarea>
          </div>

          <div class="mb-3">
            <label class="form-label fw-bold">Status Inicial:</label>
            <select id="status" name="status" class="form-select" required>
              <option value="Ativo">Ativo</option>
              <option value="Suspenso">Suspenso</option>
              <option value="Arquivado">Arquivado</option>
            </select>
          </div>

          <div class="d-flex justify-content-between mt-4">
            <a href="lista-processos.html" class="btn btn-secondary"
              >Cancelar</a
            >
            <button type="submit" class="btn btn-primary">
              Salvar Processo
            </button>
          </div>
        </form>

        <div id="mensagem" class="mt-3"></div>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.8/jquery.inputmask.min.js"></script>
    <script src="js/main.js"></script>

    <script>
      $(document).ready(function () {
        $("#navbar-container").load("navbar.html");

        $("#numero").inputmask("9999999-99.9999.9.99.9999");

        if (typeof popularSelectClientes === "function") {
          popularSelectClientes("#select-clientes");
        }
      });
    </script>
  </body>
</html>
