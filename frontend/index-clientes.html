<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Clientes - LegalTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div id="navbar-container"></div>

    <div class="container">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Gestão de Clientes</h1>
        <a href="criar-clientes.html" class="btn btn-success">Novo Cliente</a>
      </div>

      <div class="table-responsive shadow-sm rounded">
        <table class="table table-striped table-hover align-middle mb-0">
          <thead class="table-light">
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>CPF/CNPJ</th>
              <th>Email</th>
              <th>Telefone</th>
              <th class="text-center">Ações</th>
            </tr>
          </thead>
          <tbody id="clientes-tbody"></tbody>
        </table>
      </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="js/main.js"></script>

    <script>
      $(document).ready(function () {
        $("#navbar-container").load("navbar.html", function () {
          console.log("Navbar carregada com sucesso!");
        });

        if (typeof listarClientes === "function") {
          listarClientes();
        }
      });
      $(document).on("click", ".btn-deletar-cliente", function () {
        const id = $(this).data("id");
        const nome = $(this).data("nome");

        if (
          confirm(
            `Tem certeza que deseja excluir o cliente "${nome}"? Esta ação não pode ser desfeita.`,
          )
        ) {
          $.ajax({
            url: `http://127.0.0.1:8000/clientes/${id}`,
            method: "DELETE",
            success: function () {
              alert("Cliente excluído com sucesso!");
              listarClientes();
            },
            error: function (xhr) {
              alert(
                `Erro ao excluir cliente: O cliente pode possuir processos vinculados.`,
              );
            },
          });
        }
      });
    </script>
  </body>
</html>
