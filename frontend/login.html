<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - LegalTech</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
    <style>
      body {
        background-color: #f4f6f9;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .login-card {
        max-width: 450px;
        width: 100%;
        border: none;
        border-radius: 12px;
      }
      .nav-pills .nav-link.active {
        background-color: #0d6efd;
      }
      .nav-pills .nav-link {
        color: #495057;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="card shadow login-card p-4">
      <div class="text-center mb-4">
        <h1 class="text-primary fw-bold mb-1">LegalTech</h1>
        <p class="text-muted small">Sistema de Gestão Jurídica</p>
      </div>

      <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="tab-login"
            data-bs-toggle="pill"
            data-bs-target="#panel-login"
            type="button"
            role="tab"
          >
            Entrar
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="tab-cadastro"
            data-bs-toggle="pill"
            data-bs-target="#panel-cadastro"
            type="button"
            role="tab"
          >
            Criar Conta
          </button>
        </li>
      </ul>

      <div class="tab-content" id="authTabsContent">
        <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
          <form id="form-login">
            <div class="mb-3">
              <label class="form-label fw-bold">CPF:</label>
              <input
                type="text"
                id="login-cpf"
                class="form-control"
                placeholder="000.000.000-00"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Senha:</label>
              <input
                type="password"
                id="login-senha"
                class="form-control"
                placeholder="Digite sua senha"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary w-100 mt-2">
              Acessar Sistema
            </button>
          </form>
        </div>

        <div class="tab-pane fade" id="panel-cadastro" role="tabpanel">
          <form id="form-cadastro">
            <div class="mb-3">
              <label class="form-label fw-bold">Nome Completo:</label>
              <input
                type="text"
                id="cad-nome"
                class="form-control"
                placeholder="Seu nome"
                required
                minlength="3"
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">E-mail de Trabalho:</label>
              <input
                type="email"
                id="cad-email"
                class="form-control"
                placeholder="seu@email.com"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">CPF:</label>
              <input
                type="text"
                id="cad-cpf"
                class="form-control"
                placeholder="000.000.000-00"
                required
              />
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Telefone/WhatsApp:</label>
              <input
                type="text"
                id="cad-telefone"
                class="form-control"
                placeholder="(81) 99999-9999"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Tipo de Perfil:</label>
              <select id="cad-role" class="form-select" required>
                <option value="comum" selected>Usuário Comum</option>
                <option value="adm">Administrador do Sistema</option>
              </select>
            </div>

            <div class="mb-3 d-none" id="wrapper-codigo-admin">
              <label class="form-label fw-bold text-danger"
                >Código de Autenticação Admin:</label
              >
              <input
                type="password"
                id="cad-codigo-admin"
                class="form-control"
                placeholder="Digite o código mestre"
              />
            </div>

            <div class="mb-3">
              <label class="form-label fw-bold">Senha de Acesso:</label>
              <input
                type="password"
                id="cad-senha"
                class="form-control"
                placeholder="Crie uma senha forte"
                required
                minlength="6"
              />
            </div>
            <button type="submit" class="btn btn-success w-100 mt-2">
              Finalizar Cadastro
            </button>
          </form>
        </div>
      </div>
      <div id="mensagem" class="mt-3"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.8/jquery.inputmask.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      $(document).ready(function () {
        $("#login-cpf, #cad-cpf").inputmask("999.999.999-99");
        $("#cad-telefone").inputmask("(99) 99999-9999");

        $("#cad-role").change(function () {
          if ($(this).val() === "adm") {
            $("#wrapper-codigo-admin").removeClass("d-none");
            $("#cad-codigo-admin").attr("required", true);
          } else {
            $("#wrapper-codigo-admin").addClass("d-none");
            $("#cad-codigo-admin").attr("required", false).val("");
          }
        });

        $("#form-login").submit(function (e) {
          e.preventDefault();
          $("#mensagem").empty();

          const payloadLogin = {
            username: $("#login-cpf").val(),
            password: $("#login-senha").val(),
          };

          console.log("Tentando Logar:", payloadLogin);

          $.ajax({
            url: "http://127.0.0.1:8000/auth/login",
            method: "POST",
            data: payloadLogin,
            success: function (response) {
              localStorage.setItem("token_legaltech", response.access_token);
              window.location.href = "index-clientes.html";
            },
            error: function (xhr) {
              let msg = "CPF ou Senha incorretos.";
              if (xhr.responseJSON && xhr.responseJSON.detail)
                msg = xhr.responseJSON.detail;
              $("#mensagem").html(
                `<div class="alert alert-danger shadow-sm text-center">${msg}</div>`,
              );
            },
          });
        });

        $("#form-cadastro").submit(function (e) {
          e.preventDefault();
          $("#mensagem").empty();

          const payloadCadastro = {
            nome: $("#cad-nome").val(),
            email: $("#cad-email").val(),
            cpf: $("#cad-cpf").val(),
            telefone: $("#cad-telefone").val(),
            senha: $("#cad-senha").val(),
            role: $("#cad-role").val(),
            codigo_admin: $("#cad-codigo-admin").val() || null,
          };

          console.log("Tentando Cadastrar Usuário:", payloadCadastro);

          $.ajax({
            url: "http://127.0.0.1:8000/auth/cadastro",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify(payloadCadastro),
            success: function (data) {
              $("#mensagem").html(
                `<div class="alert alert-success shadow-sm text-center">Conta criada com sucesso! Faça seu login.</div>`,
              );
              $("#form-cadastro")[0].reset();
              $("#wrapper-codigo-admin").addClass("d-none");

              const loginTab = new bootstrap.Tab(
                document.querySelector("#tab-login"),
              );
              loginTab.show();
            },
            error: function (xhr) {
              let msg = "Erro ao criar conta.";
              if (xhr.responseJSON && xhr.responseJSON.detail)
                msg = xhr.responseJSON.detail;
              $("#mensagem").html(
                `<div class="alert alert-danger shadow-sm text-center">${msg}</div>`,
              );
            },
          });
        });
      });
    </script>
  </body>
</html>
